name: iOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xc=$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc"
          xcodebuild -version
      - name: Check behavior and render screens
        run: Tools/check.sh
      - name: Archive iOS app and widget
        run: |
          set -o pipefail
          xcodebuild -project Dots.xcodeproj -scheme Dots -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Dots.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive > build/archive.log 2>&1 || { tail -100 build/archive.log; exit 1; }
          test -d build/Dots.xcarchive/Products/Applications/Dots.app/PlugIns/DotsWidget.appex
          for name in CompanionAtlas CompanionBlueAtlas CompanionPillowAtlas; do
            test -s "build/Dots.xcarchive/Products/Applications/Dots.app/Resources/$name.png"
            test -s "build/Dots.xcarchive/Products/Applications/Dots.app/PlugIns/DotsWidget.appex/Resources/$name.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews-and-build-log
          if-no-files-found: error
          path: |
            build/check/*.png
            build/archive.log
