name: Dotlings store captures
on:
  push:
    branches: [main]
    paths:
      - 'Dots/**'
      - 'Shared/**'
      - 'Resources/**'
      - 'DotsWidget/**'
      - 'Dots.xcodeproj/**'
      - 'Tools/capture-store.sh'
      - 'Tools/audit-captures.swift'
      - '.github/workflows/store-captures.yml'
  workflow_dispatch:
concurrency:
  group: dotlings-store-captures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xc=$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc"
      - name: Capture native iPhone screens
        run: bash Tools/capture-store.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotlings-native-screenshots
          path: build/store-captures/
