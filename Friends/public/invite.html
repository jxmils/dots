<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>A Dotlings invitation</title><style>body{background:#f8f4ee;color:#30263c;font:18px system-ui;margin:12vh auto;padding:24px;max-width:28rem}a{color:#624487}#open{display:inline-block;padding:.8em 1.2em;border-radius:18px;background:#624487;color:white;text-decoration:none}p{line-height:1.5}</style><main><h1>A friend invited you to Dotlings.</h1><p>Open the invitation in the latest version of Dotlings on your iPhone.</p><a id="open" hidden>Open in Dotlings</a><p>New here? <a href="https://apps.apple.com/app/id6825127572">Get Dotlings</a>, then come back to this invitation.</p></main><script>
const match = /^#(together\/)?([A-Za-z0-9_-]{1,128})\/([a-f0-9]{32})$/.exec(location.hash);
const open = document.getElementById('open');
if (match) { open.href = (match[1] ? 'dots://connect/' : 'dots://invite/') + match[2] + '/' + match[3]; open.hidden = false; }
else { open.textContent = 'Ask your friend for a fresh invitation.'; open.hidden = false; }
</script></html>
